<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
</head>

<body>
   <h1>Checkout</h1>
   <section>
      <h2>Your Cart</h2>
      <img src="https://cdn.freecodecamp.org/curriculum/labs/spoon.jpg" alt="Left-handed spoon">
      <p>Left-handed Spoon</p>
      <p>$29.99</p>
   </section>
   <section>
      <h2>Payment Information</h2>
      <form action="">
         <div>
            <label for="card-name">Cardholder Name
               <span aria-hidden="true">*</span>
            </label>
            <input type="text" id="card-name" name="card-name" required>
         </div>
         <div>
            <label for="card-number">Card Number
               <span aria-hidden="true">*</span>
            </label>
            <input type="text" id="card-number" name="card-number" aria-describedby="card-number-help" required>
            <p id="card-number-help">Enter the 16-digit card number without spaces or dashes.</p>
         </div>
         <div>
            <label for="expiry-date">Expiry Date
               <span aria-hidden="true">*</span>
            </label>
            <input type="text" id="expiry-date" name="expiry-date" placeholder="MM/YY" required>
         </div>
         <div>
            <label for="cvv">CVV
               <span aria-hidden="true">*</span>
            </label>
            <input type="text" id="cvv" name="cvv" aria-describedby="Card Verification Value" required>
         </div>
         <button type="submit">Place Order</button>
      </form>
   </section>
</body>

</html>
